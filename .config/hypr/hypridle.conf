general {
    lock_cmd = pidof hyprlock || hyprlock
    # Some clients leave a stale ScreenSaver D-Bus inhibitor behind. Keep
    # Wayland and systemd inhibitors active for fullscreen/video use cases.
    ignore_dbus_inhibit = true
    before_sleep_cmd = loginctl lock-session && sleep 0.5
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })' && sleep 0.1 && hyprctl dispatch 'hl.dsp.dpms({ action = "on" })' && ~/.config/hypr/scripts/brightness_idle.sh restore
}

listener {
 timeout = 300
 on-timeout = ~/.config/hypr/scripts/brightness_idle.sh dim
 on-resume = ~/.config/hypr/scripts/brightness_idle.sh restore
}

listener {
 timeout = 900
 on-timeout = ~/.config/hypr/scripts/dpms_then_sleep.sh start 2700
 on-resume = ~/.config/hypr/scripts/dpms_then_sleep.sh cancel-and-lock
}

listener {
 timeout = 840
 on-timeout = notify-send "Inactivity detected" "Screen will turn off in 60 seconds!"
 on-resume = notify-send "Activity detected" "Screen off is prevented or lifted!"
}
