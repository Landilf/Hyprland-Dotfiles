##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

workspace = 1 , monitor:eDP-1 , default:true , persistent:true
workspace = 2 , monitor:eDP-1
workspace = 3 , monitor:eDP-1
workspace = 4 , monitor:eDP-1
workspace = 5 , monitor:eDP-1
workspace = 6 , monitor:eDP-1
workspace = 7 , monitor:eDP-1
workspace = 8 , monitor:eDP-1
workspace = 9 , monitor:eDP-1
workspace = 10 , monitor:eDP-1
workspace = 11 , monitor:eDP-1 , persistent:true
workspace = 12 , monitor:eDP-1
workspace = 13 , monitor:eDP-1
workspace = 14 , monitor:eDP-1
workspace = 15 , monitor:eDP-1
workspace = 16 , monitor:eDP-1
workspace = 17 , monitor:eDP-1
workspace = 18 , monitor:eDP-1
workspace = 19 , monitor:eDP-1
workspace = 20 , monitor:eDP-1
workspace = name:, monitor:eDP-1 , rounding:false , decorate:false , shadows:false
workspace = name:Steam, monitor:eDP-1
workspace = name:Windows, monitor:eDP-1

windowrule {
  name = maximize-and-idle
  suppress_event = maximize
  idle_inhibit = fullscreen
  match:class = .*
}

windowrule {
  name = jetbrains-xwayland-popups
  no_focus = on
  match:class = ^(jetbrains-(studio|idea|pycharm))$
  match:xwayland = 1
  match:title = ^(win[a-z]*[0-9]+)$
}

windowrule {
  name = generic-empty-xwayland-popups
  no_focus = on
  match:class = ^$
  match:title = ^$
  match:xwayland = 1
  match:float = 1
  match:fullscreen = 0
  match:pin = 0
}

windowrule {
  name = kdeconnect-app
  float = on
  center = on
  size = 1000 700
  match:class = org.kde.kdeconnect.app
}

windowrule {
  name = kdeconnect-sms
  float = on
  center = on
  size = 1000 700
  match:class = org.kde.kdeconnect.sms
}

windowrule {
  name = kdeconnect-indicator
  float = on
  center = on
  size = 1000 700
  match:class = org.kde.kdeconnect-indicator
}

windowrule {
  name = pavucontrol
  float = on
  center = on
  size = 879 879
  opacity = 0.80 0.75
  match:class = org.pulseaudio.pavucontrol
}

windowrule {
  name = blueman
  float = on
  center = on
  size = 879 879
  match:class = blueman-manager
}

windowrule {
  name = thunar-opacity
  opacity = 0.80 0.75
  match:class = thunar
}

windowrule {
  name = thunar-alt-opacity
  opacity = 0.80 0.75
  match:class = Thunar
}

windowrule {
  name = nautilus-opacity
  opacity = 0.80 0.75
  match:class = org.gnome.Nautilus
}

windowrule {
  name = text-editor-opacity
  opacity = 0.90 0.85
  match:class = org.gnome.TextEditor
}

windowrule {
  name = vscodium-opacity
  opacity = 0.90 0.85
  match:class = VSCodium
}

windowrule {
  name = steam-workspace
  workspace = name:Steam
  match:class = steam
}

windowrule {
  name = windows-workspace-microsoft
  workspace = name:Windows
  match:class = ^(Microsoft Windows)$
}

windowrule {
  name = windows-workspace-xfreerdp
  workspace = name:Windows
  match:class = ^(xfreerdp)$
}

windowrule {
  name = windows-workspace-msword
  workspace = name:Windows
  match:class = ^(msword-rdp)$
}

windowrule {
  name = windows-workspace-msexcel
  workspace = name:Windows
  match:class = ^(msexcel-rdp)$
}

windowrule {
  name = windows-workspace-mspowerpoint
  workspace = name:Windows
  match:class = ^(mspowerpoint-rdp)$
}
